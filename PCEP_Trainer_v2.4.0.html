<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCEP Rapid Practice</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Cascadia Code", Consolas, monospace;
    padding: 24px; max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { text-align: center; }
  .stat .num { font-size: 1.8rem; font-weight: bold; }
  .stat .lbl { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
  .green { color: var(--green); } .red { color: var(--red); }
  .yellow { color: var(--yellow); } .accent { color: var(--accent); } .muted { color: var(--muted); }
  .menu-btn {
    display: block; width: 100%; text-align: left; background: var(--card);
    color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; font-size: 1rem; font-family: inherit; cursor: pointer;
    margin-bottom: 10px; transition: border-color .15s;
  }
  .menu-btn:hover { border-color: var(--accent); }
  .menu-btn .desc { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .qtext { white-space: pre-wrap; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 18px; font-size: 0.95rem; line-height: 1.5; margin-bottom: 14px; }
  .opt {
    display: block; width: 100%; text-align: left; background: var(--card);
    color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-size: 0.9rem; font-family: inherit; cursor: pointer;
    margin-bottom: 8px; line-height: 1.4; transition: border-color .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: #1c2a3a; }
  .opt.correct { border-color: var(--green); background: #12261a; }
  .opt.wrong { border-color: var(--red); background: #2d1517; }
  .opt:disabled { cursor: default; }
  .opt .letter { color: var(--muted); margin-right: 8px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.85rem; color: var(--muted); gap: 8px; flex-wrap: wrap; }
  .topnav { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .topnav .btn { margin-top: 0; }
  .trendlbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .trendrow { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.8rem; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .trendrow:last-child { border-bottom: none; }
  .spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; }
  .sparkbar { width: 9px; background: var(--accent); border-radius: 2px 2px 0 0; display: inline-block; }
  .sparkbar.cur { background: var(--green); }
  .btn {
    background: var(--accent); color: #0d1117; border: none; border-radius: 8px;
    padding: 12px 24px; font-size: 0.95rem; font-weight: bold; font-family: inherit;
    cursor: pointer; margin-top: 12px;
  }
  .btn.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
  .btn.small { padding: 8px 16px; font-size: 0.85rem; margin-top: 0; }
  .timer { font-variant-numeric: tabular-nums; }
  .feedback { padding: 12px 16px; border-radius: 8px; margin: 12px 0; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
  .feedback.ok { background: #12261a; border: 1px solid var(--green); }
  .feedback.bad { background: #2d1517; border: 1px solid var(--red); }
  .expl-panel { background: var(--card); border: 1px dashed var(--accent); border-radius: 8px;
    padding: 14px 16px; margin: 10px 0; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; }
  .flagrow { margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
  .flagrow label { cursor: pointer; user-select: none; }
  .flagrow input { accent-color: var(--yellow); margin-right: 6px; }
  .result-big { font-size: 3rem; font-weight: bold; text-align: center; margin: 24px 0 8px; }
  .result-sub { text-align: center; color: var(--muted); margin-bottom: 20px; }
  .hidden { display: none; }
  .progressbar { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .2s; }
  table.cpt { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.cpt th, table.cpt td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  table.cpt th { color: var(--muted); font-weight: normal; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }
  .bar-bg { background: var(--border); border-radius: 3px; height: 8px; width: 120px; display: inline-block; vertical-align: middle; }
  .bar-bg > div { height: 100%; border-radius: 3px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
  .badge.blank { background: #3d1d20; color: var(--red); border: 1px solid var(--red); }
  .badge.weak { background: #33270e; color: var(--yellow); border: 1px solid var(--yellow); }
  .badge.solid { background: #12261a; color: var(--green); border: 1px solid var(--green); }
  .badge.unseen { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
  details summary { cursor: pointer; color: var(--accent); font-size: 0.85rem; padding: 8px 0; }
  .histline { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); padding: 4px 0; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<h1>PCEP <span>Rapid Practice</span></h1>
<div class="sub">Mission: pass the real PCEP (30 questions / 40 min) &ge; 75% — train to &gt; 90% &middot; 148-question verified bank &middot; 100-card PCEP-only flashcard deck</div>
<nav id="topnav" class="topnav hidden">
  <button class="btn secondary small" onclick="backOut()">🏠 Home</button>
  <span class="muted" id="navHint" style="font-size:0.78rem"></span>
</nav>

<!-- ============ HOME ============ -->
<div id="home">
  <div class="card">
    <div class="stats-grid" id="homeStats"></div>
  </div>
  <div class="card" id="trendsCard">
    <div class="trendlbl">📈 Blind-spot trends</div>
    <div id="trendsBody"></div>
  </div>
  <div id="resumeSlot"></div>
  <button class="menu-btn" onclick="startExam()">
    ⏱ Exam Simulation — 30 Q / 40 min
    <div class="desc">Mirrors the real PCEP: 30 questions, 40-minute countdown, pass bar 75% (real exam: 70%)</div>
  </button>
  <button class="menu-btn" onclick="startDrill('all')">
    🔁 Drill All (Random Order)
    <div class="desc">All 148 questions, instant feedback + explanations, reshuffled every run</div>
  </button>
  <button class="menu-btn" onclick="startDrill('blank')">
    🎯 Blank-Spot Drill (Algorithmic)
    <div class="desc">Questions the engine flagged: accuracy below 70%, or any miss</div>
  </button>
  <button class="menu-btn" onclick="startDrill('flagged')">
    ⚑ Flagged Drill (Your Blind Spots)
    <div class="desc">Every question YOU flagged for review with the ⚑ checkbox</div>
  </button>
  <button class="menu-btn" onclick="startDrill('multi')">
    ☑ Multi-Select Focus
    <div class="desc">The 14 "Select two answers" questions — the classic PCEP trap</div>
  </button>
  <button class="menu-btn" onclick="startFlashcards()">
    🃏 Flashcard Drill — 100 PCEP-only cards
    <div class="desc">Official PCEP-30-02 objective coverage; show question, reveal answer, mark known/again</div>
  </button>
  <button class="menu-btn" onclick="showStats()">
    📊 Statistics &amp; Blind-Spot Analysis
    <div class="desc">Per-question and per-concept accuracy, your flags, run history, 90% readiness</div>
  </button>
</div>

<!-- ============ QUIZ ============ -->
<div id="quiz" class="hidden">
  <div class="bar">
    <button class="btn secondary small" onclick="backOut()">← Back</button>
    <div><span id="qPos"></span> &middot; <span id="modeLabel"></span></div>
    <div class="timer" id="timer"></div>
  </div>
  <div class="progressbar"><div id="progFill" style="width:0%"></div></div>
  <div class="qtext" id="qText"></div>
  <div id="opts"></div>
  <div id="fb"></div>
  <div id="explainBox"></div>
  <div class="flagrow"><label><input type="checkbox" id="flagChk" onchange="toggleFlag()"> ⚑ Flag this question for review (adds to your blind spots)</label></div>
  <button class="btn hidden" id="nextBtn" onclick="nextQ()">Next →</button>
  <button class="btn hidden" id="submitMultiBtn" onclick="submitMulti()">Submit</button>
</div>

<!-- ============ FLASHCARDS ============ -->
<div id="flash" class="hidden">
  <div class="bar">
    <button class="btn secondary small" onclick="goHome()">← Back</button>
    <div><span id="fcPos"></span> &middot; FLASHCARD DRILL</div>
    <div id="fcScore"></div>
  </div>
  <div class="progressbar"><div id="fcProg" style="width:0%"></div></div>
  <div class="qtext" id="fcQ" onclick="revealCard()" style="cursor:pointer"></div>
  <div class="muted" id="fcMeta"></div>
  <div class="expl-panel hidden" id="fcA"></div>
  <button class="btn hidden" id="fcKnown" onclick="rateCard(1)">✅ I know this</button>
  <button class="btn secondary hidden" id="fcAgain" onclick="rateCard(0)">🔁 Show me again</button>
  <div class="feedback ok" style="margin-top:16px" id="fcDone" hidden>Deck complete — reshuffle and run it again.</div>
</div>

<!-- ============ RESULTS ============ -->
<div id="results" class="hidden">
  <div class="bar"><button class="btn secondary small" onclick="goHome()">← Back</button> <button class="btn small" onclick="newFullRun()">🆕 New Full Run — 148</button></div>
  <div class="result-big" id="resultBig"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="card" id="resultBreakdown"></div>
  <div id="reviewList"></div>
</div>

<!-- ============ STATS ============ -->
<div id="statsScr" class="hidden">
  <div class="bar"><button class="btn secondary small" onclick="goHome()">← Back</button></div>
  <div class="card"><div class="stats-grid" id="statsTop"></div></div>
  <div id="statsBody"></div>
</div>

<script>const PCEP_BANK = [{"id": 1, "q": "Python is an example of:", "options": ["a high-level programming language", "a machine language", "a natural language"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — Python is a high-level programming language: human-readable source that gets translated for the CPU. ❌ B — machine language is raw binary executed directly by the processor. ❌ C — natural languages are human languages like English or Polish.", "explsrc": "expert-reviewed"}, {"id": 2, "q": "A complete set of known commands is called:", "options": ["an instruction list", "a machine list", "a low-level list"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — a complete set of known commands is called an instruction list (IL). ❌ B/C — 'machine list' and 'low-level list' are invented terms with no meaning in computing.", "explsrc": "expert-reviewed"}, {"id": 3, "q": "What is a source code?", "options": ["A program written in a high-level programming language", "Machine code executed by computers", "Another name for a source file"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — source code is a program written in a high-level programming language, readable by humans. ❌ B — that describes machine code, the translated output. ❌ C — a source FILE contains source code; the code itself is the program text.", "explsrc": "expert-reviewed"}, {"id": 4, "q": "What do you call a computer program which directly executes instructions written in a programming language?", "options": ["An interpreter", "A compiler", "A translator"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — an interpreter directly executes instructions written in a programming language, line by line. ❌ B — a compiler translates the whole program into machine code first. ❌ C — 'translator' is a generic term, not the specific tool.", "explsrc": "expert-reviewed"}, {"id": 5, "q": "What Python version is covered in this course?", "options": ["Python 3", "Python 2", "Python 1"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — the course (and the PCEP exam) covers Python 3. ❌ B/C — Python 2 is legacy (end-of-life 2020) and Python 1 is historical.", "explsrc": "expert-reviewed"}, {"id": 6, "q": "What is CPython?", "options": ["The default implementation of the Python programming language", "Another name for Cython, a superset of the Python programming language", "A compiled language used to perform high-level programming functions"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — CPython is the default, reference implementation of Python, written in the C language. ❌ B — that describes Cython, a separate superset project. ❌ C — CPython is not itself a compiled language.", "explsrc": "expert-reviewed"}, {"id": 7, "q": "What is IDLE?", "options": ["An acronym that stands for Integrated Development and Learning Environment for Python", "A version of Python", "An acronym that stands for Interactive Development and Learning Extension"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — IDLE = Integrated Development and Learning Environment, Python's bundled editor/IDE. ❌ B — IDLE is not a Python version. ❌ C — 'Interactive Development and Learning Extension' is a made-up expansion.", "explsrc": "expert-reviewed"}, {"id": 8, "q": "What do you call a tool that lets you launch your code step-by-step and inspect it at each moment of execution?", "options": ["A debugger", "An editor", "A console"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — a debugger launches code step-by-step and lets you inspect state at each moment. ❌ B — an editor only writes code. ❌ C — a console executes commands but doesn't step through them.", "explsrc": "expert-reviewed"}, {"id": 9, "q": "How did Python, the programming language, get its name?", "options": ["Guido van Rossum named it to honor Monty Python's Flying Circus, a BBC comedy series popular in the 1970s", "Guido van Rossum named it after the Pythonidae - a family of large, nonvenomous snakes", "Guido van Rossum named it to honor Python of Catana, a dramatic poet of the time of Alexander the Great"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — Guido van Rossum named Python after Monty Python's Flying Circus, the BBC comedy. ❌ B — the snake became the logo/mascot but is NOT the name's origin. ❌ C — Python of Catana is a fictional invention.", "explsrc": "expert-reviewed"}, {"id": 10, "q": "Which one of the following is an example of a Python file extension?", "options": ["py", "p", "pi"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — .py is the standard Python file extension. ❌ B — .p is not a Python extension. ❌ C — .pi is not either.", "explsrc": "expert-reviewed"}, {"id": 11, "q": "What is the expected behavior of the following program?\nprint(\"Hello!\")", "options": ["The program will output Hello! to the screen", "The program will output \"Hello!\" to the screen", "The program will output (\"Hello!\") to the screen", "The program will generate an error message on the screen"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — print(\"Hello!\") outputs Hello! without the quotes. ❌ B — Python does not print the quotation marks; they only delimit the string literal. ❌ C — parentheses are not part of the output. ❌ D — the code is valid; no error occurs.", "explsrc": "expert-reviewed"}, {"id": 12, "q": "What is true about compilation? (Select two answers)", "options": ["The code is converted directly into machine code executable by the processor", "It tends to be faster than interpretation", "It tends to be slower than interpretation", "Both you and the end user must have the compiler to run your code"], "type": "Multiple Choice", "answers": [1, 3], "concept": "Python Basics", "expl": "✅ A+B — compilation converts code directly into machine code, and compiled code tends to run faster than interpreted code. ❌ C — the opposite of the truth. ❌ D — the end user needs only the compiled binary, not the compiler.", "explsrc": "expert-reviewed"}, {"id": 13, "q": "What is machine code?", "options": ["A low-level programming language consisting of binary digits/bits that the computer reads and understands", "A low-level programming language consisting of hexadecimal digits that make up high-level language instructions", "A medium-level programming language consisting of the assembly code designed for the computer processor", "A high-level programming language consisting of instruction lists that humans can read and understand"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — machine code is a low-level language of binary digits (bits) that the CPU reads and understands directly. ❌ B — hexadecimal is human-friendly notation, not what the processor reads. ❌ C — assembly is a separate low-level language. ❌ D — that describes a high-level language.", "explsrc": "expert-reviewed"}, {"id": 14, "q": "What do you call a command-line interpreter which lets you interact with your OS and execute Python commands and scripts?", "options": ["A console", "An editor", "Jython", "A compiler"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — a console (command-line interpreter) lets you interact with the OS and execute Python commands. ❌ B — an editor only writes code. ❌ C — Jython is a Python implementation running on the JVM. ❌ D — a compiler translates code, not an interactive tool.", "explsrc": "expert-reviewed"}, {"id": 15, "q": "Select the true statements? (Select two answers)", "options": ["Python is a good choice for creating and executing tests for applications", "Python is free, open-source, and multiplatform", "Python is a good choice for low-level programming, e.g., when you want to implement an effective driver", "Python 3 is backwards compatible with Python 2"], "type": "Multiple Choice", "answers": [0, 1], "concept": "Python Basics", "expl": "✅ A+B — Python is widely used for writing application tests, and it is free, open-source and multiplatform. ❌ C — Python is a poor choice for low-level programming (too slow, not close to hardware). ❌ D — Python 3 is deliberately NOT backwards compatible with Python 2.", "explsrc": "expert-reviewed"}, {"id": 16, "q": "What is CPython?", "options": ["It's the default, reference implementation of Python, written in the C language", "It's a programming language that is a superset of Python, designed to produce C-like performance with code written in Python", "It's a programming language that is a superset of the C language, designed to produce Python-like performance with code written in C", "It's the default, reference implementation of the C language, written in Python"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — CPython is the default, reference implementation of Python written in C. ❌ B — that's Cython (a Python superset for C-like performance). ❌ C — garbled definition. ❌ D — reverses the two languages.", "explsrc": "expert-reviewed"}, {"id": 17, "q": "What is the expected behavior of the following program?\nprin(\"Goodbye!\")", "options": ["The program will output Goodbye! to the screen", "The program will output \"Goodbye!\"", "The program will output (\"Goodbye!\")", "The program will generate an error message on the screen"], "type": "Single Choice", "answers": [3], "concept": "Output & Strings", "expl": "✅ D — prin is not a defined function (print is) → NameError at runtime, so an error message is generated. ❌ A/B/C — nothing is printed because the code fails before any output.", "explsrc": "expert-reviewed"}, {"id": 18, "q": "What do you call a file containing a program written in a high-level programming language?", "options": ["A source file", "A machine file", "A code file", "A target file"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — a file containing a program written in a high-level language is a source file. ❌ B — 'machine file' is not a term. ❌ C — 'code file' is informal, not the proper term. ❌ D — a target file is compiler OUTPUT.", "explsrc": "expert-reviewed"}, {"id": 19, "q": "What are the four fundamental elements that make a language?", "options": ["An alphabet, a lexis, a syntax, and semantics", "An alphabet, a lexis, phonetics, and semantics", "An alphabet, phonetics, phonology, and semantics", "An alphabet, morphology, phonetics, and semantics"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — every language is built on an alphabet (character set), lexis (words), syntax (grammar rules) and semantics (meaning). ❌ B/C/D — phonetics, phonology and morphology describe SPOKEN sound systems, irrelevant to programming languages.", "explsrc": "expert-reviewed"}, {"id": 20, "q": "What is the best definition of a script?", "options": ["It's a text file that contains instructions which make up a Python program", "It's an error message generated by the compiler", "It's an error message generated by the interpreter", "It's a text file that contains sequences of zeroes and ones"], "type": "Single Choice", "answers": [0], "concept": "Python Basics", "expl": "✅ A — a script is a text file containing instructions that make up a program. ❌ B/C — scripts are not error messages. ❌ D — a file of zeroes and ones is machine code, the opposite of a script.", "explsrc": "expert-reviewed"}, {"id": 21, "q": "The escape character owes its name to the fact that it:", "options": ["changes the meaning of the character next to it", "cannot be caught due to its high speed", "escapes from source files into the computer memory"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — the escape character (\\) changes the meaning of the character next to it, e.g. \\n means newline instead of letter n. ❌ B — a programmer joke, not a definition. ❌ C — meaningless.", "explsrc": "expert-reviewed"}, {"id": 22, "q": "The meaning of the positional parameter is determined by its:", "options": ["position", "appearance", "name"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — a positional parameter's meaning is determined by its position in the parameter list. ❌ B — appearance is irrelevant. ❌ C — name-based determination is a KEYWORD parameter.", "explsrc": "expert-reviewed"}, {"id": 23, "q": "The most important difference between integer and floating-point numbers lies in the fact that:", "options": ["they are stored differently in the computer memory", "they cannot be used simultaneously", "integers cannot be literals, while floats can"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — integers are stored exactly; floats use an approximate binary (IEEE 754) representation — they are stored differently in memory. ❌ B — ints and floats mix freely in expressions. ❌ C — integers can absolutely be literals (e.g. 123).", "explsrc": "expert-reviewed"}, {"id": 24, "q": "The 0x prefix means that the number after it is denoted as:", "options": ["a hexadecimal", "an octal", "a decimal"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — the 0x prefix marks a hexadecimal literal (e.g. 0x123). ❌ B — octal uses 0o. ❌ C — decimal has no prefix.", "explsrc": "expert-reviewed"}, {"id": 25, "q": "The // operator:", "options": ["performs integer division", "performs regular division", "does not exist"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — // performs integer (floor) division, discarding the fractional part. ❌ B — regular division is /. ❌ C — // very much exists.", "explsrc": "expert-reviewed"}, {"id": 26, "q": "The result of the following addition:\n123 + 0.0", "options": ["is equal to 123.0", "is equal to 123", "cannot be evaluated"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • 123 + 0.0    →  evaluates to 123.0  [type promotion: int + float → float]\n❌ B — does not match the traced execution.\n❌ C — does not match the traced execution.", "explsrc": "execution-verified"}, {"id": 27, "q": "Only one of the following statements is true - which one?", "options": ["multiplication precedes addition", "addition precedes multiplication", "neither statement can be evaluated"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — multiplication has higher precedence than addition, so it is evaluated first. ❌ B — the reverse is false in Python and in mathematics. ❌ C — both statements are perfectly evaluable.", "explsrc": "expert-reviewed"}, {"id": 28, "q": "Right-sided binding means that the following expression:\n1 ** 2 ** 3\nwill be evaluated:", "options": ["from right to left", "from left to right", "in random order"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — the ** operator binds right-sided: 1 ** 2 ** 3 means 1 ** (2 ** 3) = 1 ** 8. ❌ B — left-sided binding would give (1 ** 2) ** 3 = 1, a different result. ❌ C — evaluation order is strictly defined, never random.", "explsrc": "expert-reviewed"}, {"id": 29, "q": "A keyword is a word that:  (Select two answers)", "options": ["cannot be used as a variable name", "cannot be used as a function name", "is the most important word in the whole program"], "type": "Multiple Choice", "answers": [0, 1], "concept": "Python Basics", "expl": "✅ A+B — a keyword is a reserved word: it cannot be used as a variable name nor as a function name. ❌ C — keywords are reserved, not 'the most important word' of a program.", "explsrc": "expert-reviewed"}, {"id": 30, "q": "A value returned by the input() function is:", "options": ["a string", "an integer", "a float"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — input() always returns a string, even if the user types digits; convert with int() or float(). ❌ B/C — automatic numeric conversion never happens.", "explsrc": "expert-reviewed"}, {"id": 31, "q": "What is the output of the following snippet?\nx = 1\ny = 2\nz = x\nx = y\ny = z\nprint(x, y)", "options": ["2 1", "1 2", "1 1", "2 2"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — walk through it line by line:\n  • x = 1    →  x = 1\n  • y = 2    →  y = 2\n  • z = x    →  z = 1\n  • x = y    →  x = 2\n  • y = z    →  y = 1\n  • print(x, y)    →  prints '2 1'\n  → output: '2 1'\n❌ B — the executed trace above ends with '2 1' — this is not what the code produces.\n❌ C — the executed trace above ends with '2 1' — this is not what the code produces.\n❌ D — the executed trace above ends with '2 1' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 32, "q": "What is the output of the following snippet?\nz = y = x = 1\nprint(x, y, z, sep='*')", "options": ["1*1*1", "1 1 1", "x*y*z", "x y z"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — walk through it line by line:\n  • z = y = x = 1\n  • print(x, y, z, sep='*')    →  prints '1*1*1'\n  → output: '1*1*1'\n❌ B — the executed trace above ends with '1*1*1' — this is not what the code produces.\n❌ C — the executed trace above ends with '1*1*1' — this is not what the code produces.\n❌ D — the executed trace above ends with '1*1*1' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 33, "q": "The meaning of the keyword parameter is determined by:", "options": ["the argument's name specified along with its value", "its position within the argument list", "its connection with existing variables", "its value"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — a keyword argument's meaning is determined by the argument's name specified along with its value (fun(y=2)). ❌ B — position defines POSITIONAL arguments. ❌ C/D — existing variables and the value alone play no role.", "explsrc": "expert-reviewed"}, {"id": 34, "q": "Which of the following statements are true? (Select two answers)", "options": ["The result of the / operator is always an integer value.", "The right argument of the % operator cannot be zero.", "Addition precedes multiplication.", "The ** operator uses right-sided binding."], "type": "Multiple Choice", "answers": [1, 3], "concept": "Operators & Math", "expl": "✅ B+D — the right argument of % cannot be zero (ZeroDivisionError), and ** uses right-sided binding. ❌ A — / always produces a float, never an integer. ❌ C — addition never precedes multiplication.", "explsrc": "expert-reviewed"}, {"id": 35, "q": "What is the output of the following snippet if the user enters two lines containing 11 and 4 respectively?\nx = int(input())\ny = int(input())\nx = x % y\nx = x % y\ny = y % x\nprint(y)", "options": ["1", "2", "3", "4"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • x = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • y = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • x = x % y    →  x = 11 % 4 = 3\n  • x = x % y    →  x = 3 % 4 = 3\n  • y = y % x    →  y = 4 % 3 = 1\n  • print(y)    →  prints '1'\n  → output: '1'\n❌ B — the executed trace above ends with '1' — this is not what the code produces.\n❌ C — this value appears as an INTERMEDIATE state around step 6, but the program keeps running and ends at '1'.\n❌ D — this value appears as an INTERMEDIATE state around step 5, but the program keeps running and ends at '1'.", "explsrc": "execution-verified"}, {"id": 36, "q": "What is the output of the following snippet?\nx = 1 / 2 + 3 // 3 + 4 ** 2\nprint(x)", "options": ["17.5", "17", "8", "8.5"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • x = 1 / 2 + 3 // 3 + 4 ** 2    →  x = 17.5\n        · 4 ** 2 = 16\n        · 1 / 2 = 0.5\n        · 3 // 3 = 1\n        · 0.5 + 1 = 1.5\n        · 1.5 + 16 = 17.5\n  • print(x)    →  prints '17.5'\n  → output: '17.5'\n❌ B — the executed trace above ends with '17.5' — this is not what the code produces.\n❌ C — the executed trace above ends with '17.5' — this is not what the code produces.\n❌ D — the executed trace above ends with '17.5' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 37, "q": "What is the output of the following snippet if the user enters two lines containing 3 and 6 respectively?\nx = input()\ny = int(input())\nprint(x * y)", "options": ["333333", "18", "666", "36"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — walk through it line by line:\n  • x = input()\n  • y = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • print(x * y)    →  prints '333333'\n  → output: '333333'\n❌ B — the executed trace above ends with '333333' — this is not what the code produces.\n❌ C — the executed trace above ends with '333333' — this is not what the code produces.\n❌ D — the executed trace above ends with '333333' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 38, "q": "Which of the following variable names are illegal? (Select two answers)", "options": ["True", "true", "TRUE", "and"], "type": "Multiple Choice", "answers": [0, 3], "concept": "Python Basics", "expl": "✅ A+D — True is a reserved keyword and and is a keyword, so both are illegal variable names. ❌ B+C — true and TRUE are legal identifiers: Python is case-sensitive and only the exact spelling True is a keyword.", "explsrc": "expert-reviewed"}, {"id": 39, "q": "The \\n digraph forces the print() function to:", "options": ["break the output line", "output exactly two characters: \\ and n", "duplicate the character next to the digraph", "stop its execution"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — \\n inside a string forces print() to break the output line (newline). ❌ B — printing two literal characters requires \\\\n. ❌ C — the digraph duplicates nothing. ❌ D — it has no effect on execution.", "explsrc": "expert-reviewed"}, {"id": 40, "q": "The print() function can output values of:", "options": ["any number of arguments (including zero)", "any number of arguments (excluding zero)", "just one argument", "not more than five arguments"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — print() accepts any number of arguments, including zero (it then just prints an empty line). ❌ B — zero arguments is legal. ❌ C/D — no such limits exist.", "explsrc": "expert-reviewed"}, {"id": 41, "q": "What is the output of the following snippet if the user enters two lines containing 2 and 4 respectively?\nx = int(input())\ny = int(input())\nx = x / y\ny = y / x\nprint(y)", "options": ["8.0", "4.0", "2.0", "the code will cause a runtime error"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • x = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • y = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • x = x / y    →  x = 2 / 4 = 0.5\n  • y = y / x    →  y = 4 / 0.5 = 8.0\n  • print(y)    →  prints '8.0'\n  → output: '8.0'\n❌ B — the executed trace above ends with '8.0' — this is not what the code produces.\n❌ C — the executed trace above ends with '8.0' — this is not what the code produces.\n❌ D — the executed trace above ends with '8.0' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 42, "q": "What is the output of the following snippet?\ny = 2 + 3 * 5.\nprint(Y)", "options": ["the snippet will cause an execution error", "25.", "17", "17.0"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — y is assigned but the code prints Y; Python is case-sensitive → NameError, an execution error. ❌ B/C/D — the program never reaches a print.", "explsrc": "expert-reviewed"}, {"id": 43, "q": "The result of the following division:\n1 / 1", "options": ["is equal to 1.0", "is equal to 1", "cannot be evaluated", "cannot be predicted"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • 1 / 1    →  evaluates to 1.0\n❌ B — does not match the traced execution.\n❌ C — does not match the traced execution.\n❌ D — does not match the traced execution.", "explsrc": "execution-verified"}, {"id": 44, "q": "What is the output of the following snippet if the user enters two lines containing 2 and 4 respectively?\nx = input()\ny = input()\nprint(x + y)", "options": ["24", "2", "4", "6"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — walk through it line by line:\n  • x = input()\n  • y = input()\n  • print(x + y)    →  prints '24'\n  → output: '24'\n❌ B — the executed trace above ends with '24' — this is not what the code produces.\n❌ C — the executed trace above ends with '24' — this is not what the code produces.\n❌ D — the executed trace above ends with '24' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 45, "q": "What is the output of the following snippet if the user enters two lines containing 2 and 4 respectively?\nx = int(input())\ny = int(input())\nprint(x + y)", "options": ["6", "24", "2", "4"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — walk through it line by line:\n  • x = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • y = int(input())    →  int(<function run_trace.<locals>.worker.<locals>.mock_input>())\n  • print(x + y)    →  prints '6'\n  → output: '6'\n❌ B — the executed trace above ends with '6' — this is not what the code produces.\n❌ C — this value appears as an INTERMEDIATE state around step 3, but the program keeps running and ends at '6'.\n❌ D — this value appears as an INTERMEDIATE state around step 3, but the program keeps running and ends at '6'.", "explsrc": "execution-verified"}, {"id": 46, "q": "The 0o prefix means that the number after it is denoted as:", "options": ["octal", "binary", "decimal", "hexadecimal"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — 0o marks an octal literal (e.g. 0o123). ❌ B — binary is 0b. ❌ C — decimal has no prefix. ❌ D — hexadecimal is 0x.", "explsrc": "expert-reviewed"}, {"id": 47, "q": "What is the output of the following snippet if the user enters two lines containing 2 and 4 respectively?\nx = int(input())\ny = int(input())\nx = x // y\ny = y // x\nprint(y)", "options": ["the code will cause a runtime error", "2.0", "4.0", "8.0"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — x = 2 // 4 = 0, then y = y // x = 4 // 0 → ZeroDivisionError at runtime. ❌ B/C/D — no value can be printed.", "explsrc": "expert-reviewed"}, {"id": 48, "q": "The value twenty point twelve times ten raised to the power of eight should be written as:", "options": ["20.12E8", "20.12*10^8", "20.12E8.0", "20E12.8"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — 20.12E8 is valid Python scientific notation for 20.12 × 10⁸. ❌ B — ^ is bitwise XOR in Python, not exponentiation. ❌ C — E8.0 is malformed. ❌ D — 20E12.8 is malformed.", "explsrc": "expert-reviewed"}, {"id": 49, "q": "The ** operator:", "options": ["performs exponentiation", "does not exist", "performs floating-point multiplication", "performs duplicated multiplication"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — ** is the exponentiation (power) operator. ❌ B — it exists. ❌ C/D — it performs no kind of multiplication.", "explsrc": "expert-reviewed"}, {"id": 50, "q": "Left-sided binding determines that the result of the following expression:\n1 // 2 * 3\nis equal to:", "options": ["0", "4.5", "0.0", "0.16666666666666666"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • 1 // 2 * 3    →  evaluates to 0\n        · 1 // 2 = 0\n        · 0 * 3 = 0\n❌ B — does not match the traced execution.\n❌ C — does not match the traced execution.\n❌ D — does not match the traced execution.", "explsrc": "execution-verified"}, {"id": 51, "q": "An operator able to check whether two values are not equal is coded as:", "options": ["!=", "not ==", "<>"], "type": "Single Choice", "answers": [0], "concept": "Logic & Comparison", "expl": "✅ A — != is the inequality operator. ❌ B — 'not ==' is a syntax error. ❌ C — <> was removed in Python 3.", "explsrc": "expert-reviewed"}, {"id": 52, "q": "How many stars will the following snippet send to the console?\ni = 2\nwhile i >= 0:\n    print(\"*\")\n    i -= 2", "options": ["two", "one", "three"], "type": "Single Choice", "answers": [0], "concept": "Loops", "expl": "✅ A — the loop ran 3 pass(es); here is each pass:\n  • pass 1: var 2 → becomes 0 → prints '*'\n  • pass 2: var 0 → becomes -2 → prints '*'\n  • pass 3: var -2 → becomes -2 → no print\n  → '*' was printed 2 time(s) total: '* *'\n  → that's why the answer is A (two '*').\n❌ B — the trace printed exactly 2 '*'; count them in the pass list above.\n❌ C — the trace printed exactly 2 '*'; count them in the pass list above.", "explsrc": "execution-verified"}, {"id": 53, "q": "How many hashes will the following snippet send to the console?\nfor i in range(-1, 1):\n    print(\"#\")", "opt n's completion"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — parameters are local variables, accessible only inside the function body. ❌ B — they are invisible outside. ❌ C — they exist during the call, not after it.", "explsrc": "expert-reviewed"}, {"id": 84, "q": "A way of passing arguments in which the order of the arguments determines the initial parameters' values is referred to as:", "options": ["positional", "ordered", "sequential"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — passing arguments by order is positional passing. ❌ B/C — 'ordered' and 'sequential' are not the terms Python uses.", "explsrc": "expert-reviewed"}, {"id": 85, "q": "Which of the following statements are true? (Select two answers)", "options": ["The return keyword forces the function to restart its execution", "The return keyword may cause the function to return a value", "The return keyword forces the function's execution to terminate"], "type": "Multiple Choice", "answers": [1, 2], "concept": "Functions", "expl": "✅ B+C — return may send a value back to the caller and it terminates the function's execution. ❌ A — return never restarts execution; it ends it.", "explsrc": "expert-reviewed"}, {"id": 86, "q": "The None keyword designates:", "options": ["a None value", "a function which doesn't return a value", "an empty instruction"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — None designates the None value (explicit absence of a value). ❌ B — that describes the implicit return of functions without return. ❌ C — the empty instruction is pass, not None.", "explsrc": "expert-reviewed"}, {"id": 87, "q": "A variable defined outside a function:", "options": ["may be read, but not written (something more is needed to do so)", "may not be accessed in any way inside the function", "may be freely accessed inside the function"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — a variable defined outside a function may be READ inside it, but assigning to it requires the global keyword. ❌ B — reading works fine. ❌ C — unrestricted access is false: writing is restricted.", "explsrc": "expert-reviewed"}, {"id": 88, "q": "If a list is passed into a function as an argument, deleting any of its elements inside the function using the del instruction:", "options": ["will affect the argument", "will not affect the argument", "will cause a runtime error"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — lists are passed by reference, so del inside the function removes the element from the ORIGINAL list. ❌ B — the mutation is visible outside. ❌ C — del on a valid index never raises.", "explsrc": "expert-reviewed"}, {"id": 89, "q": "What is the output of the following snippet?\ndef fun(in=2, out=3):\n    return in * out\nprint(fun(3))", "options": ["the snippet is erroneous (invalid syntax)", "6", "9"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — 'in' is a reserved keyword, so def fun(in=2) is a syntax error. ❌ B/C — the code fails before any call.", "explsrc": "expert-reviewed"}, {"id": 90, "q": "What is the output of the following snippet?\ntup = (1, ) + (1, )\ntup = tup + tup\nprint(len(tup))", "options": ["4", "2", "the snippet is erroneous (invalid syntax)"], "type": "Single Choice", "answers": [0], "concept": "Tuples", "expl": "✅ A — walk through it line by line:\n  • tup = (1, ) + (1, )    →  tup = (1, ) + (1, ) = (1, 1)  [concatenation: 1 element + 1 element = 2 elements]\n  • tup = tup + tup    →  tup = (1, 1) + (1, 1) = (1, 1, 1, 1)  [concatenation: 2 elements + 2 elements = 4 elements]\n  • print(len(tup))    →  tup = (1, 1, 1, 1), len = 4 → prints '4'\n  → output: '4'\n❌ B — the executed trace above ends with '4' — this is not what the code produces.\n❌ C — the executed trace above ends with '4' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 91, "q": "What is the output of the following program if the user enters kangaroo at the first prompt and 0 at the second prompt?\ntry:\n    first_prompt = input(\"Enter the first value: \")\n    a = len(first_prompt)\n    second_prompt = input(\"Enter the second value: \")\n    b = len(second_prompt) * 2\n    print(a/b)\nexcept ZeroDivisionError:\n    print(\"Do not divide by zero!\")\nexcept ValueError:\n    print(\"Wrong value.\")\nexcept:\n    print(\"Error.Error.Error.\")", "options": ["4.0", "Error.Error.Error.", "Do not divide by zero!", "Wrong value."], "type": "Single Choice", "answers": [0], "concept": "Exceptions & Errors", "expl": "✅ A — a = len('kangaroo') = 8; b = len('0') * 2 = 2; print(8 / 2) → 4.0. Live-verified. ❌ B/C/D — no exception occurs: 2 is a valid divisor and both inputs convert via len().", "explsrc": "expert-reviewed"}, {"id": 92, "q": "What is the expected behavior of the following program if the user enters 0?\nvalue = input(\"Enter a value: \")\nprint(10/value)", "options": ["The program will raise the TypeError exception.", "The program will raise the ValueError exception.", "The program will raise the ZeroDivisionError exception.", "The program will output 0 to the console."], "type": "Single Choice", "answers": [0], "concept": "Exceptions & Errors", "expl": "✅ A — input() returns the STRING '0'; 10 / '0' mixes int and str → TypeError. ❌ B — ValueError requires a failed int()/float() conversion. ❌ C — ZeroDivisionError requires a numeric zero. ❌ D — the division never happens.", "explsrc": "expert-reviewed"}, {"id": 93, "q": "What is the output of the following snippet?\ndictionary = {'one': 'two', 'three': 'one', 'two': 'three'}\nv = dictionary['one']\nfor k in range(len(dictionary)):\n    v = dictionary[v]\nprint(v)", "options": ["two", "three", "one", "('one', 'two', 'three')"], "type": "Single Choice", "answers": [0], "concept": "Dictionaries", "expl": "✅ A — walk through it line by line:\n  • dictionary = {'one': 'two', 'three': 'one', 'two': 'three'}    →  dictionary = {'one': 'two', 'three': 'one', 'two': 'three'}\n  • v = dictionary['one']    →  v = {'one': 'two', 'three': 'one', 'two': 'three'}['one'] = 'two'\n  • for k in range(len(dictionary)):\n  • v = dictionary[v]    →  v = {'one': 'two', 'three': 'one', 'two': 'three'}['two'] = 'three'\n  • for k in range(len(dictionary)):    →  k = 0\n  • v = dictionary[v]    →  v = {'one': 'two', 'three': 'one', 'two': 'three'}['three'] = 'one'\n  • for k in range(len(dictionary)):    →  k = 1\n  • v = dictionary[v]    →  v = {'one': 'two', 'three': 'one', 'two': 'three'}['one'] = 'two'\n  • for k in range(len(dictionary)):    →  k = 2\n  • print(v)    →  prints 'two'\n  → output: 'two'\n❌ B — the executed trace above ends with 'two' — this is not what the code produces.\n❌ C — the executed trace above ends with 'two' — this is not what the code produces.\n❌ D — the executed trace above ends with 'two' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 94, "q": "What is the output of the following code?\ntry:\n    value = input(\"Enter a value: \")\n    print(value/value)\nexcept ValueError:\n    print(\"Bad input...\")\nexcept ZeroDivisionError:\n    print(\"Very bad input...\")\nexcept TypeError:\n    print(\"Very very bad input...\")\nexcept:\n    print(\"Booo!\")", "options": ["Very very bad input...", "Very bad input...", "Bad input...", "Booo!"], "type": "Single Choice", "answers": [0], "concept": "Exceptions & Errors", "expl": "✅ A — value is a string, so value / value raises TypeError → 'Very very bad input...'. Live-verified. ❌ B — no division by zero occurs (the operands aren't numeric). ❌ C — no conversion failure. ❌ D — the TypeError handler catches it first.", "explsrc": "expert-reviewed"}, {"id": 95, "q": "A built-in function is a function which:", "options": ["comes with Python, and is an integral part of Python", "has been placed within your code by another programmer", "has to nippet is erroneous. ❌ B/C/D — no output is produced.", "explsrc": "expert-reviewed"}, {"id": 99, "q": "What is the output of the following snippet?\ndef any():\n    print(var + 1, end='')\nvar = 1\nany()\nprint(var)", "options": ["21", "12", "11", "22"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — walk through it line by line:\n  • def any():\n  • var = 1    →  var = 1\n  • any()    →  evaluates to None\n  • [in any()] print(var + 1, end='')    →  prints '21'\n  • print(var)    →  prints ''\n  → output: '21'\n❌ B — the executed trace above ends with '21' — this is not what the code produces.\n❌ C — the executed trace above ends with '21' — this is not what the code produces.\n❌ D — the executed trace above ends with '21' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 100, "q": "What is the output of the following snippet?\ndef fun(x):\n    x += 1\n    return x\nx = 2\nx = fun(x + 1)\nprint(x)", "options": ["4", "5", "3", "the code is erroneous"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — walk through it line by line:\n  • def fun(x):\n  • x = 2    →  x = 2\n  • x = fun(x + 1)    →  x = <function fun>(2 + 1) = 4\n  • [in fun()] x += 1    →  x = 3 + (1) = 4\n  • [in fun()] return x    →  returns 4\n  • print(x)    →  prints '4'\n  → output: '4'\n❌ B — the executed trace above ends with '4' — this is not what the code produces.\n❌ C — this value appears as an INTERMEDIATE state around step 4, but the program keeps running and ends at '4'.\n❌ D — the executed trace above ends with '4' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 101, "q": "The following snippet:\ndef func_1(a):\n    return a ** a\ndef func_2(a):\n    return func_1(a) * func_1(a)\nprint(func_2(2))", "options": ["will output 16", "will output 4", "will output 2", "is erroneous"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — walk through it line by line:\n  • def func_1(a):\n  • def func_2(a):\n  • print(func_2(2))    →  prints '16'\n  • [in func_2()] return func_1(a) * func_1(a)    →  returns func_1(2) * func_1(2)\n  • [in func_1()] return a ** a    →  returns 2 ** 2\n  → output: '16'\n❌ B — the executed trace above ends with '16' — this is not what the code produces.\n❌ C — the executed trace above ends with '16' — this is not what the code produces.\n❌ D — the executed trace above ends with '16' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 102, "q": "Which one of the following lines properly starts a parameterless function definition?", "options": ["def fun():", "def fun:", "function fun():", "fun function():"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — def fun(): is the correct parameterless definition: keyword, name, parentheses, colon. ❌ B — missing parentheses. ❌ C/D — 'function' is not a Python keyword.", "explsrc": "expert-reviewed"}, {"id": 103, "q": "What is the output of the following snippet?\ndef fun(x, y, z):\n    return x + 2 * y + 3 * z\nprint(fun(0, z=1, y=3))", "options": ["9", "0", "3", "the snippet is erroneous"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — walk through it line by line:\n  • def fun(x, y, z):\n  • print(fun(0, z=1, y=3))    →  prints '9'\n  • [in fun()] return x + 2 * y + 3 * z    →  returns 0 + 2 * 3 + 3 * 1\n        · 2 * 3 = 6\n        · 3 * 1 = 3\n        · 0 + 6 = 6\n        · 6 + 3 = 9\n  → output: '9'\n❌ B — this value appears as an INTERMEDIATE state around step 3, but the program keeps running and ends at '9'.\n❌ C — this value appears as an INTERMEDIATE state around step 3, but the program keeps running and ends at '9'.\n❌ D — the executed trace above ends with '9' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 104, "q": "Select the true statements about the try-except block in relation to the following example. (Select two answers.)\ntry:\n    # Some code is here...\nexcept:\n    # Some code is here...", "options": ["If you suspect that a snippet may raise an exception, you should place it in the try block.", "The code that follows the except statement will be executed if the code in the try clause runs into an error.", "If there is a syntax error in code located in the try block, the except branch will not handle it, and a SyntaxError exception will be raised instead.", "The code that follows the try statement will be executed if the code in the except clause runs into an error."], "type": "Multiple Choice", "answers": [0, 1], "concept": "Exceptions & Errors", "expl": "✅ A+B — code you suspect may raise an exception goes in the try block, and the except branch runs when the try clause errors. ❌ C — tempting, but the official PCEP key treats the compile-time SyntaxError statement as not one of the two true answers. ❌ D — backwards: try runs BEFORE except, never because of it. (Verified against the official PE1 Module 4 answer key.)", "explsrc": "expert-reviewed"}, {"id": 105, "q": "Which of the following lines properly starts a function using two parameters, both with zeroed default values?", "options": ["def fun(a=0, b=0):", "def fun(a=b=0):", "fun fun(a=0, b):", "fun fun(a, b=0):"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — def fun(a=0, b=0): gives both parameters zeroed defaults. ❌ B — chained defaults a=b=0 are illegal. ❌ C/D — 'fun fun(...)' is not Python syntax.", "explsrc": "expert-reviewed"}, {"id": 106, "q": "What is the output of the following snippet?\ndef fun(x):\n    global y\n    y = x * x\n    return y\nfun(2)\nprint(y)", "options": ["4", "2", "None", "the code will cause a runtime error"], "type": "Single Choice", "answers": [0], "concept": "Variables & Types", "expl": "✅ A — walk through it line by line:\n  • def fun(x):\n  • fun(2)    →  evaluates to 4\n  • [in fun()] y = x * x    →  y = 2 * 2 = 4\n  • [in fun()] return y    →  returns y\n  • print(y)    →  prints '4'\n  → output: '4'\n❌ B — this value appears as an INTERMEDIATE state around step 4, but the program keeps running and ends at '4'.\n❌ C — the executed trace above ends with '4' — this is not what the code produces.\n❌ D — the executed trace above ends with '4' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 107, "q": "Assuming that my_tuple is a correctly created tuple, the fact that tuples are immutable means that the following instruction:\nmy_tuple[1] = my_tuple[1] + my_tuple[0]", "options": ["is illegal", "can be executed if and only if the tuple contains at least two elements", "is fully correct", "may be illegal if the tuple contains strings"], "type": "Single Choice", "answers": [0], "concept": "Tuples", "expl": "✅ A — tuples are immutable: my_tuple[1] = ... raises TypeError — the instruction is illegal. ❌ B/C — no tuple ever allows item assignment. ❌ D — immutability has nothing to do with element types.", "explsrc": "expert-reviewed"}, {"id": 108, "q": "The following snippet:\ndef func(a, b):\n    return a ** a\nprint(func(2))", "options": ["is erroneous", "will output 4", "will output 2", "will return None"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — func(a, b) requires two arguments but is called with one → TypeError (missing argument) — the snippet is erroneous. ❌ B/C/D — the function never runs.", "explsrc": "expert-reviewed"}, {"id": 109, "q": "What code would you insert instead of the comment to obtain the expected output?\nExpected output:\na\nb\nc\nCode:\ndictionary = {}\nmy_list = ['a', 'b', 'c', 'd']\nfor i in range(len(my_list) - 1):\n    dictionary[my_list[i]] = (my_list[i], )\nfor i in sorted(dictionary.keys()):\n    k = dictionary[i]\n    # Insert your code here.", "options": ["print(k[0])", "print(k['0'])", "print(k)", "print(k[\"0\"])"], "type": "Single Choice", "answers": [0], "concept": "Dictionaries", "expl": "✅ A — k = dictionary[i] is a one-element tuple like ('a',), so k[0] prints a, b, c. ❌ B/D — tuple indices are integers, not strings. ❌ C — print(k) would print the whole tuple ('a',).", "explsrc": "expert-reviewed"}, {"id": 110, "q": "What is the output of the following snippet?\ndef f(x):\n    if x == 0:\n        return 0\n    return x + f(x - 1)\nprint(f(3))", "options": ["6", "3", "1", "the code is erroneous"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — walk through it line by line:\n  • def f(x):\n  • print(f(3))    →  prints '6'\n  • [in f()] if x == 0:    →  checks 3 == 0\n  • [in f()] return x + f(x - 1)    →  returns 3 + f(3 - 1)\n  • [in f()] if x == 0:    →  checks 2 == 0\n  • [in f()] return x + f(x - 1)    →  returns 2 + f(2 - 1)\n  • [in f()] if x == 0:    →  checks 1 == 0\n  • [in f()] return x + f(x - 1)    →  returns 1 + f(1 - 1)\n  • [in f()] if x == 0:    →  checks 0 == 0\n  • [in f()] return 0    →  returns 0\n  → output: '6'\n❌ B — this value appears as an INTERMEDIATE state around step 4, but the program keeps running and ends at '6'.\n❌ C — this value appears as an INTERMEDIATE state around step 8, but the program keeps running and ends at '6'.\n❌ D — the executed trace above ends with '6' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 111, "q": "Which of the following statements are true? (Select two answers)", "options": ["The None value cannot be used outside functions", "The None value can be assigned to variables", "The None value can be compared with variables", "The None value can be used as an argument of arithmetic operators"], "type": "Multiple Choice", "answers": [1, 2], "concept": "Variables & Types", "expl": "✅ B+C — None can be assigned to variables and compared with variables (x is None). ❌ A — None is usable anywhere. ❌ D — None in arithmetic (None + 1) raises TypeError.", "explsrc": "expert-reviewed"}, {"id": 112, "q": "What is the output of the following snippet?\ntup = (1, 2, 4, 8)\ntup = tup[1:-1]\ntup = tup[0]\nprint(tup)", "options": ["2", "(2)", "(2, )", "the snippet is erroneous"], "type": "Single Choice", "answers": [0], "concept": "Tuples", "expl": "✅ A — walk through it line by line:\n  • tup = (1, 2, 4, 8)    →  tup = (1, 2, 4, 8)\n  • tup = tup[1:-1]    →  tup = (1, 2, 4, 8)[1:-1] = (2, 4)\n  • tup = tup[0]    →  tup = (2, 4)[0] = 2\n  • print(tup)    →  prints '2'\n  → output: '2'\n❌ B — the executed trace above ends with '2' — this is not what the code produces.\n❌ C — the executed trace above ends with '2' — this is not what the code produces.\n❌ D — the executed trace above ends with '2' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 113, "q": "What is the output of the following snippet?\ndef fun(inp=2, out=3):\n    return inp * out\nprint(fun(out=2))", "options": ["4", "6", "2", "the snippet is erroneous"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — walk through it line by line:\n  • def fun(inp=2, out=3):\n  • print(fun(out=2))    →  prints '4'\n  • [in fun()] return inp * out    →  returns 2 * 2\n  → output: '4'\n❌ B — the executed trace above ends with '4' — this is not what the code produces.\n❌ C — this value appears as an INTERMEDIATE state around step 3, but the program keeps running and ends at '4'.\n❌ D — the executed trace above ends with '4' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 114, "q": "A function defined in the following way:  (Select two answers)\ndef function(x=0):\n    return x", "options": ["may be invoked without any argument", "must be invoked with exactly one argument", "may be invoked with exactly one argument", "must be invoked without any argument"], "type": "Multiple Choice", "answers": [0, 2], "concept": "Functions", "expl": "✅ A+C — with x=0 defaulted, function() may be invoked with no argument and with exactly one argument. ❌ B — 'must' is false: the "q": "The following snippet:\ndef function_1(a):\n    return None\ndef function_2(a):\n    return function_1(a) * function_1(a)\nprint(function_2(2))", "options": ["will cause a runtime error", "will output 2", "will output 4", "will output 16"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — function_1 returns None, and None * None raises TypeError — a runtime error. ❌ B/C/D — no multiplication of None can produce a number.", "explsrc": "expert-reviewed"}, {"id": 118, "q": "What is the output of the following snippet?\ndef fun(x, y):\n    if x == y:\n        return x\n    else:\n        return fun(x, y-1)\nprint(fun(0, 3))", "options": ["0", "1", "2", "the snippet will cause a runtime error"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — walk through it line by line:\n  • def fun(x, y):\n  • print(fun(0, 3))    →  prints '0'\n  • [in fun()] if x == y:    →  checks 0 == 3\n  • [in fun()] return fun(x, y-1)    →  returns fun(0, 3-1)\n  • [in fun()] if x == y:    →  checks 0 == 2\n  • [in fun()] return fun(x, y-1)    →  returns fun(0, 2-1)\n  • [in fun()] if x == y:    →  checks 0 == 1\n  • [in fun()] return fun(x, y-1)    →  returns fun(0, 1-1)\n  • [in fun()] if x == y:    →  checks 0 == 0\n  • [in fun()] return x    →  returns 0\n  → output: '0'\n❌ B — this value appears as an INTERMEDIATE state around step 8, but the program keeps running and ends at '0'.\n❌ C — this value appears as an INTERMEDIATE state around step 6, but the program keeps running and ends at '0'.\n❌ D — the executed trace above ends with '0' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 119, "q": "What is the output of the following piece of code if the user enters two lines containing 3 and 6 respectively?\ny = input()\nx = input()\nprint(x + y)", "options": ["63", "36", "6", "3"], "type": "Single Choice", "answers": [0], "concept": "Output & Strings", "expl": "✅ A — walk through it line by line:\n  • y = input()\n  • x = input()\n  • print(x + y)    →  prints '63'\n  → output: '63'\n❌ B — the executed trace above ends with '63' — this is not what the code produces.\n❌ C — the executed trace above ends with '63' — this is not what the code produces.\n❌ D — the executed trace above ends with '63' — this is not what the code produces.", "explsrc": "execution-verified"}, {"id": 120, "q": "The result of the following division:\n1 // 2", "options": ["is equal to 0", "is equal to 0.5", "is equal to 0.0", "cannot be predicted"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — 1 // 2 is integer division: 0 (an int, not 0.0). ❌ B — 0.5 is regular division. ❌ C — 0.0 would require /. ❌ D — the result is fully predictable.", "explsrc": "expert-reviewed"}, {"id": 121, "q": "Which of the following lines correctly invoke the function defined below?    (Select two answers)\ndef fun(a, b, c=0):\n    # Body of the function.", "options": ["fun(b=1)", "fun(b=0, a=0)", "fun()", "fun(0, 1, 2)"], "type": "Multiple Choice", "answers": [1, 3], "concept": "Functions", "expl": "✅ B+D — fun(b=0, a=0) supplies the two required parameters by keyword, and fun(0, 1, 2) supplies all three positionally. ❌ A — fun(b=1) omits required a. ❌ C — fun() omits both a and b.", "explsrc": "expert-reviewed"}, {"id": 122, "q": "What is the output of the following code if the user enters a 0?\ntry:\n    value = input(\"Enter a value: \")\n    print(int(value)/len(value))\nexcept ValueError:\n    print(\"Bad input...\")\nexcept ZeroDivisionError:\n    print(\"Very bad input...\")\nexcept TypeError:\n    print(\"Very very bad input...\")\nexcept:\n    print(\"Booo!\")", "options": ["0.0", "Very bad input...", "Bad input...", "Booo!", "Very very bad input...", "1.0"], "type": "Single Choice", "answers": [0], "concept": "Exceptions & Errors", "expl": "✅ A — int('0') succeeds; 0 / len('0') = 0 / 1 = 0.0, printed normally. Live-verified. ❌ B — '0' converts fine, so ram will cause a SyntaxError exception.", "The program will cause a ZeroDivisionError exception and output a default error message.", "The program will cause a ZeroDivisionError exception and output the following message: Too bad...", "The program will raise an exception handled by the first except block.", "The program will cause a ValueError exception and output a default error message.", "The program will cause a ValueError exception and output the following message: Too bad..."], "type": "Single Choice", "answers": [0], "concept": "Exceptions & Errors", "expl": "✅ A — break outside a loop is a compile-time SyntaxError; the try/except machinery never even starts. ❌ B/C/E/F — except blocks cannot catch syntax errors.", "explsrc": "expert-reviewed"}, {"id": 126, "q": "The following snippet:\ndef func(a, b):\n    return b ** a\nprint(func(b=2, 2))", "options": ["is erroneous", "will output 2", "will output 4", "will output None"], "type": "Single Choice", "answers": [0], "concept": "Functions", "expl": "✅ A — func(b=2, 2) puts a positional argument after a keyword argument → SyntaxError. ❌ B/C/D — the call is rejected before the function runs.", "explsrc": "expert-reviewed"}, {"id": 127, "q": "Which of the following sentences are true about the code?   (Select two answers)\nnums = [1, 2, 3]\nvals = nums", "options": ["nums and vals are different names of the same list", "nums has the same length as vals", "vals is longer than nums", "nums and vals are different lists"], "type": "Multiple Choice", "answers": [0, 1], "concept": "Python Basics", "expl": "✅ A+B — vals = nums makes both names aliases of the same list: different names, same list, same length. ❌ C — neither grows. ❌ D — there is only ONE list.", "explsrc": "expert-reviewed"}, {"id": 128, "q": "An operator able to check whether two values are not equal is coded as:", "options": ["!=", "not ==", "<>", "=/="], "type": "Single Choice", "answers": [0], "concept": "Logic & Comparison", "expl": "✅ A — != is the not-equal operator. ❌ B — 'not ==' is a syntax error. ❌ C — <> is gone in Python 3. ❌ D — =/= is not Python.", "explsrc": "expert-reviewed"}, {"id": 129, "q": "What is the output of the following piece of code?\nx = 1 // 5 + 1 / 5\nprint(x)", "options": ["0.2", "0.4", "0", "0.0"], "type": "Single Choice", "answers": [0], "concept": "Operators & Math", "expl": "✅ A — walk through it line by line:\n  • 1 // 5 + 1 / 5    →  evaluates to 0.2\n        · 1 // 5 = 0\n        · 1 / 5 = 0.2\n        · 0 + 0.2 = 0.2\n❌ B — does not match the traced execution.\n❌ C — does not match the traced execution.\n❌ D — does not match the traced execution.", "explsrc": "execution-verified"}, {"id": 130, "q": "How many stars (*) will the following snippet send to the console?\ni = 0\nwhile i < i + 2 :\n    i += 1\n    print(\"*\")\nelse:\n    print(\"*\")", "options": ["the snippet will enter an infinite loop, printing one star per line", "zero", "one", "two"], "type": "Single Choice", "answers": [0], "concept": "Loops", "expl": "✅ A — i < i + 2 is always True, so the loop never ends: an infinite loop printing one star per line forever. ❌ B/C/D — no fixed count exists.", "explsrc": "expert-reviewed"}, {"id": 131, "q": "What will happen when you attempt to run the following code?\nprint(Hello, World!)", "options": ["The code will raise the SyntaxError exception.", "The code will raise the ValueError exception.", "The code will raise the AttributeError exception.", "The code will raise the TypeError exception.", "The code will print Hello, World! to the console."], "type": "Single Choice", "answers": [0], "concept": "Exceptions & Errors", "expl": "✅ A — print(Hello, World!) is missing quotation marks, so the interpreter fails at parse time with SyntaxError. ❌ B/C/D — the error is caught before execution, and it is a syntax error.", "explsrc": "expert-reviewed"}, {"id": 132, "q": "How many hashes (#) will the following snippet send to the console?\nlst = [[x for x in range(3)] for y in range(3)]\nfor r in range(3):\n    for c in range(3):\n        if lst[r][c] % 2 != 0:\n              print(\"#\")", "options": ["three", "zero", "six", "nine"], "type": "Single Choice", "answers": [0], "concept": "Lists", "expl": "✅ A — the loop ran 16 pass(es); here is each pass:\n  • pass 1: var None → becomes None → no print\n  • pass 2: var None → becomes 0 → no print\n  • pass 3: var 0 → becomes 1 → prints '#'\n  • pass 4: var 1 → becomes 2 → no print\n  • pass 5: var 2 → becomes None → no print\n  • pass 6: var None → becomes 2 → no print\n  • pass 7: var 2 → becomes 0 → no print\n  • pass 8: var 0 → becomes 1 → prints '#'\n  • pass 9: var 1 → becomes 2 → no print\n  • pass 10: var 2 → becomes None → no print\n  • pass 11: var None → becomes 2 → no print\n  • pass 12: var 2 → becomes 0 → no print\n  • pass 13: var 0 → becomes 1 → prints '#'\n  • pass 14: var 1 → becomes 2 → no print\n  • pass 15: var 2 → becomes None → no print\n  • pass 16: var None → becomes None → no print\n  → '#' was printed 3 time(s) total: '# # #'\n  → that's why the answer is A (three '#').\n❌ B — the trace printed exactly 3 '#'; count them in the pass list above.\n❌ C — the trace printed exactly 3 '#'; count them in the pass list above.\n❌ D — the trace printed exactly 3 '#'; count them in the pass list above.", "explsrc": "execution-verified"}, {"id": 133, "q": "What is the output of the following snippet?\ndct = {}\ndct['1'] = (1, 2)\ndct['2'] = (2, 1)\nfor x in dct.keys():\n    print(dct[x][1], end=\"\")", "options": ["21", "12", "(1,2)", "(2,1)"], "type": "Single Choice", "answers": [0], "concept": "Dictionaries", "expl": "✅ A — walk through it line by line:\n  • dct = {}    →  dct = {}\n  • dct['1'] = (1, 2)\n  • dct['2'] = (2, 1)\n  • for x in dct.keys():\n  • print(dct[x][1], end=\"\")    →  prints '21'\n  • for x in dct.keys():    →  x = '1'\n  • for x in dct.keys():    →  x = '2'\n  → output: '21'\n❌ B — the executed trace above ends with '21' — this is not what the code produces.
